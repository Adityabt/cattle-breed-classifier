<!doctype html>
<html>
  <head>
    <title>Cattle Breed Classifier</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>

  <body>

    <!-- 🔥 NAVBAR -->
    <div class="navbar">
      <div class="nav-content">
        <div class="logo">🐄 CattleAI</div>

        <div class="nav-links">
          <span onclick="location.href='/'">Home</span>
          <span onclick="document.getElementById('imageInput').click()">Predict</span>
          <span onclick="location.href='/about'">About</span>
        </div>
      </div>
    </div>

    <!-- 🟢 MAIN CONTAINER -->
    <div class="container-1">
      <h1>Cattle Breed Classifier</h1>
      <p class="subtitle">
        AI-based Breed Identification using ResNet50 + AGPN + MVFF
      </p>

      <form action="/predict" method="post" enctype="multipart/form-data">
        <label class="upload-box">
          <input
            type="file"
            name="images"
            id="imageInput"
            accept="image/*"
            multiple
            required
          />
          <span>Click to Upload Cattle Images</span>
        </label>

        <!-- 🔥 IMAGE PREVIEW -->
        <div id="preview-container" style="display: none; margin-top: 20px">
          <p>Selected Images:</p>
          <div id="preview-grid"></div>
        </div>

        <br />
        <button type="submit" id="predict-btn">Predict Breed</button>
      </form>
    </div>

    <!-- 🔥 LOADING OVERLAY -->
    <div id="loading-overlay">
      <div class="loader-box">
        <div class="spinner"></div>
        <p>Analyzing Image(s)...</p>
      </div>
    </div>

    <!-- ✅ SCRIPT -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

    <!-- 🔥 ABOUT SCROLL SCRIPT -->
    <script>
      function scrollToAbout() {
        const section = document.getElementById("about-section");

        if (section) {
          section.scrollIntoView({
            behavior: "smooth"
          });
        }
      }
    </script>

  </body>
</html>
